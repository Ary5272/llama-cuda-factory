name: Factory

# llama-cpp-python wheel factory -> AIencoder/llama-cpp-wheels.
#
#   CPU wheels  -> quay.io/pypa/manylinux_2_28_x86_64 (AlmaLinux 8: gcc 14 + binutils 2.40,
#                  glibc 2.28). Modern toolchain assembles every instruction (AVX-VNNI,
#                  AVX-512 VBMI/BF16, AMX); glibc 2.28 < 2.31 so wheels tag cleanly and stay
#                  compatible. This is the image upstream uses. Package manager is dnf.
#   CUDA wheels -> nvidia/cuda:*-devel-ubuntu20.04, self-contained, all architectures (apt).
#
# No GPU is used; nvcc cross-compiles. Both tag manylinux_2_31_x86_64.
#
# FAILURE LOGGING: any job that fails writes the tail of its build log to
# failures/<wheel>.txt and commits it, so errors can be read straight from the repo.
#
# EMERGENCY STOP: set "enabled": false in config.json. To kill a running run, use the
# Cancel workflow button — nothing is lost, the queue is derived from the dataset.

on:
  schedule:
    # Every 15 min. concurrency (group: factory, below) means a new tick waits for the
    # current run instead of stacking, so this self-throttles to "as fast as a run finishes"
    # — ~12h for the whole backlog. GitHub's scheduler is best-effort and may fire less often
    # under load; that's fine, it just paces itself. Once the queue is empty each tick plans
    # nothing and builds nothing (harmless). Set "enabled": false in config.json to stop.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Wheels this run (20 run in parallel on Free; extra queue behind them)"
        default: "40"
      dry_run:
        description: "Plan only — build nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- plan
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count || '0' }}
      remaining: ${{ steps.plan.outputs.remaining }}
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Emergency stop check
        id: gate
        run: |
          EN=$(python3 -c "import json; print(str(json.load(open('config.json')).get('enabled', True)).lower())")
          echo "enabled=$EN" >> $GITHUB_OUTPUT
          if [ "$EN" != "true" ]; then
            echo "::warning::Factory disabled in config.json — planning and building skipped."
            printf '# Factory queue\n\n**STOPPED** — `enabled` is false in config.json.\n' > QUEUE.md
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - name: Install planner deps
        if: steps.gate.outputs.enabled == 'true'
        run: pip install "huggingface_hub>=0.28"

      - name: Work out what's missing
        id: plan
        if: steps.gate.outputs.enabled == 'true'
        env:
          BATCH: ${{ github.event.inputs.batch_size || '20' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open("config.json"))
          cfg["batch_size"] = int(os.environ["BATCH"])
          json.dump(cfg, open("config.json", "w"), indent=2)
          PY
          python plan.py

      - name: Publish the board
        run: |
          git config user.name  "factory[bot]"
          git config user.email "factory@users.noreply.github.com"
          git add -A QUEUE.md queue.json config.json || true
          git diff --staged --quiet || git commit -m "queue: ${{ steps.plan.outputs.remaining || 'stopped' }} [skip ci]"
          git push || true

      - name: Summary
        run: |
          {
            echo "### Factory"
            echo ""
            if [ "${{ steps.gate.outputs.enabled }}" != "true" ]; then
              echo "**STOPPED** via config.json."
            else
              echo "Dispatching **${{ steps.plan.outputs.count }}**, **${{ steps.plan.outputs.remaining }}** left after this."
            fi
          } >> $GITHUB_STEP_SUMMARY

  # --------------------------------------------------------------- build
  build:
    needs: plan
    if: >-
      needs.plan.outputs.enabled == 'true' &&
      needs.plan.outputs.count != '0' &&
      github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # CPU -> manylinux_2_28 (modern toolchain, dnf). CUDA -> CUDA devel image (apt).
    container:
      image: ${{ matrix.kind == 'cuda' && format('nvidia/cuda:{0}-devel-ubuntu20.04', matrix.cuda) || 'quay.io/pypa/manylinux_2_28_x86_64:latest' }}

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out the repo (for fix_wheel_name.py + failure logging)
        uses: actions/checkout@v4

      # Persist compiled objects across runs. The 7 pythons of the same variant+version share
      # identical C++ objects (only the binding differs), so a ccache hit skips most of the
      # compile. Keyed by variant+llama; restore-keys let a near-miss still reuse a lot.
      - name: ccache
        uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ matrix.kind }}-${{ matrix.variant }}-${{ matrix.llama }}
          restore-keys: |
            ccache-${{ matrix.kind }}-${{ matrix.variant }}-
            ccache-${{ matrix.kind }}-

      # Cache the glslc binary (vulkan shader compiler, built from source below). Only the
      # first vulkan job builds it (~10 min); every later vulkan job restores it instantly.
      - name: Cache glslc (vulkan only)
        if: startsWith(matrix.variant, 'vulkan')
        uses: actions/cache@v4
        with:
          path: /tmp/glslc-bin
          key: glslc-shaderc-v1

      # ---- tooling: two package managers, chosen by image ----
      - name: Build tooling (CUDA image, apt)
        if: matrix.kind == 'cuda'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils ccache
          rm -rf /var/lib/apt/lists/*
          echo "glibc: $(ldd --version | head -1)"
          nvcc --version

      - name: Build tooling (manylinux image, dnf)
        if: matrix.kind == 'cpu'
        run: |
          # gcc 14 + binutils 2.40 are already on PATH in manylinux_2_28. git/curl present.
          dnf install -y ccache || echo "::warning::ccache unavailable (build still works, just no cache)"
          gcc --version | head -1
          echo "assembler: $(as --version | head -1)"
          echo "glibc: $(ldd --version | head -1)"

      # Backend dev libraries. CUDA/basic variants need none. Package names differ per distro.
      - name: Backend libraries (CPU variants, dnf)
        if: matrix.kind == 'cpu'
        run: |
          # EPEL first — opencl/vulkan/clblast headers all live there. (The earlier bug: only
          # clblast enabled EPEL, so opencl/vulkan silently got no packages and cmake failed.)
          case "${{ matrix.variant }}" in
            openblas*) dnf install -y openblas-devel || echo "::warning::openblas-devel failed" ;;
            vulkan*)
              # EPEL via direct RPM — gets vulkan-loader-devel + vulkan-headers.
              dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm || true
              dnf install -y vulkan-loader-devel vulkan-headers || echo "::warning::vulkan loader/headers failed"
              # glslc isn't in any dnf repo and prebuilt downloads are unreliable, so build it
              # from shaderc source. Cached (see 'Cache glslc' step) so only the first vulkan
              # job pays the ~10 min; later jobs restore the binary.
              if [ -f /tmp/glslc-bin/glslc ]; then
                cp /tmp/glslc-bin/glslc /usr/local/bin/glslc && chmod +x /usr/local/bin/glslc
                echo "glslc restored from cache"
              else
                # Build glslc from shaderc. Use pip's modern ninja (EL8's dnf ninja-build is
                # 1.8.2, which has the 'multiple outputs' depslog bug that later breaks the
                # Vulkan wheel build). Point cmake at gcc-toolset-14 explicitly (not on PATH yet).
                pip install ninja >/dev/null 2>&1 || true
                NINJA=$(command -v ninja || echo ninja)
                git clone --depth 1 https://github.com/google/shaderc /tmp/shaderc
                ( cd /tmp/shaderc && ./utils/git-sync-deps \
                  && cmake -B build -G Ninja \
                       -DCMAKE_MAKE_PROGRAM="$NINJA" \
                       -DCMAKE_BUILD_TYPE=Release \
                       -DSHADERC_SKIP_TESTS=ON \
                       -DSHADERC_SKIP_EXAMPLES=ON \
                       -DCMAKE_C_COMPILER=/opt/rh/gcc-toolset-14/root/usr/bin/gcc \
                       -DCMAKE_CXX_COMPILER=/opt/rh/gcc-toolset-14/root/usr/bin/g++ \
                  && cmake --build build --target glslc_exe -j "$(nproc)" )
                GLSLC=$(find /tmp/shaderc/build -name glslc -type f | head -1)
                if [ -n "$GLSLC" ]; then
                  mkdir -p /tmp/glslc-bin
                  cp "$GLSLC" /tmp/glslc-bin/glslc
                  cp "$GLSLC" /usr/local/bin/glslc
                  echo "glslc built from source"
                else
                  echo "::warning::glslc build failed — vulkan will fail"
                fi
              fi
              glslc --version 2>/dev/null | head -1 || echo "::warning::glslc not runnable"
              ;;
            opencl*)
              dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm || true
              # ocl-icd-devel gives the ICD loader (libOpenCL.so). But EPEL's opencl-headers
              # are OpenCL 2.2-era, and llama.cpp needs 3.0 symbols (CL_DEVICE_OPENCL_C_ALL_VERSIONS
              # etc). Pull the canonical 3.0 headers from Khronos — header-only, no build.
              dnf install -y ocl-icd-devel || echo "::warning::ocl-icd-devel failed"
              git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers /tmp/ocl-headers \
                && cp -r /tmp/ocl-headers/CL /usr/include/ \
                && echo "OpenCL 3.0 headers installed" \
                || echo "::warning::OpenCL 3.0 headers failed"
              ;;
            clblast*)
              dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm || true
              dnf install -y clblast-devel || echo "::warning::clblast unavailable" ;;
            sycl*)
              # SYCL builds with Intel's DPC++ compiler (icpx), from the SAME oneAPI repo we
              # use for MKL. Big (~5GB toolchain) so sycl jobs are slow, but it's the real
              # Intel-documented path and it works. llama.cpp SYCL also wants MKL, installed here too.
              tee /etc/yum.repos.d/oneAPI.repo >/dev/null <<'REPO'
          [oneAPI]
          name=Intel oneAPI
          baseurl=https://yum.repos.intel.com/oneapi
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          REPO
              dnf install -y intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl-devel \
                || echo "::warning::SYCL toolchain install failed — build will fail"
              ;;
            mkl*)
              tee /etc/yum.repos.d/oneAPI.repo >/dev/null <<'REPO'
          [oneAPI]
          name=Intel oneAPI
          baseurl=https://yum.repos.intel.com/oneapi
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://yum.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          REPO
              dnf install -y intel-oneapi-mkl-devel || echo "::warning::MKL install failed"
              ;;
          esac

      # CUDA only: point cmake at the driver stub (container has no real libcuda.so).
      - name: Locate the CUDA driver library
        if: matrix.kind == 'cuda'
        run: |
          DRIVER=$(find /usr/local/cuda* -name 'libcuda.so' 2>/dev/null | head -1)
          if [ -z "$DRIVER" ]; then DRIVER=$(find /usr/local/cuda* -name 'libcuda.so*' 2>/dev/null | head -1); fi
          if [ -z "$DRIVER" ]; then echo "::error::no libcuda.so under /usr/local/cuda*"; exit 1; fi
          echo "CUDA_DRIVER_LIB=$DRIVER" >> $GITHUB_ENV
          echo "driver library: $DRIVER"

      - name: Python ${{ matrix.python }} + build deps
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          uv python install ${{ matrix.python }}
          uv venv --python ${{ matrix.python }} /opt/buildvenv
          . /opt/buildvenv/bin/activate
          uv pip install "cmake>=3.28" ninja build wheel auditwheel scikit-build-core patchelf
          patchelf --version

      - name: Fetch ${{ matrix.llama }}
        run: |
          git clone --depth 1 --recursive --shallow-submodules \
            --branch "${{ matrix.llama }}" \
            https://github.com/abetlen/llama-cpp-python.git /src
          test -d /src/vendor/llama.cpp || { echo "::error::submodule missing"; exit 1; }

      - name: Stamp local version
        run: |
          F=/src/llama_cpp/__init__.py
          CUR=$(grep -oP '__version__\s*=\s*"\K[^"]+' "$F")
          sed -i "s/__version__ = \"$CUR\"/__version__ = \"$CUR+${{ matrix.variant }}\"/" "$F"
          echo "building $CUR+${{ matrix.variant }} for ${{ matrix.python }}"

      # The variant name is the recipe. Map instruction tail + backend prefix to cmake flags.
      - name: Compile
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          . /opt/buildvenv/bin/activate
          V="${{ matrix.variant }}"

          CPU="-DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_AVX512=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_SSE42=OFF -DGGML_BMI2=OFF"
          case "$V" in
            *avx512*vnni*vbmi*bf16*amx*) CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_AVX512=ON -DGGML_AVX512_VNNI=ON -DGGML_AVX512_VBMI=ON -DGGML_AVX512_BF16=ON -DGGML_FMA=ON -DGGML_F16C=ON" ;;
            *avx512*vnni*vbmi*)          CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_AVX512=ON -DGGML_AVX512_VNNI=ON -DGGML_AVX512_VBMI=ON -DGGML_FMA=ON -DGGML_F16C=ON" ;;
            *avx512*)                    CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_AVX512=ON -DGGML_FMA=ON -DGGML_F16C=ON" ;;
            *avx2*avxvnni*)              CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_AVX_VNNI=ON -DGGML_FMA=ON -DGGML_F16C=ON" ;;
            *avx2*fma*f16c*)             CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON" ;;
            *avx*f16c*)                  CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_F16C=ON" ;;
            *avx*)                       CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON" ;;
          esac

          BACKEND=""
          SYCL_BUILD=""
          case "$V" in
            openblas*) BACKEND="-DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS" ;;
            mkl*)      BACKEND="-DGGML_BLAS=ON -DGGML_BLAS_VENDOR=Intel10_64lp" ;;
            vulkan*)   BACKEND="-DGGML_VULKAN=ON" ;;
            clblast*)  BACKEND="-DGGML_CLBLAST=ON" ;;
            opencl*)   BACKEND="-DGGML_OPENCL=ON" ;;
            sycl*)     BACKEND="-DGGML_SYCL=ON -DGGML_SYCL_TARGET=INTEL -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx"; SYCL_BUILD=1 ;;
            rpc*)      BACKEND="-DGGML_RPC=ON" ;;
            cu*)       BACKEND="-DGGML_CUDA=ON -DGGML_CUDA_FORCE_MMQ=ON -DCMAKE_CUDA_ARCHITECTURES=all -DCUDA_cuda_driver_LIBRARY=${CUDA_DRIVER_LIB}" ;;
          esac

          export CMAKE_ARGS="$BACKEND $CPU"
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)

          # Force the modern ninja (from the build venv / pip, 1.11+). EL8's dnf ninja-build is
          # 1.8.2 and hits 'multiple outputs aren't supported by depslog' on Vulkan's shader
          # rules. Whichever ninja is on PATH here is the pip one; pin it so nothing shadows it.
          NINJA_BIN=$(command -v ninja || true)
          [ -n "$NINJA_BIN" ] && export CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_MAKE_PROGRAM=$NINJA_BIN"

          # Use the persisted ccache. GGML_CCACHE is on by default but warned "not found"
          # before; now ccache is installed and pointed at the cached dir.
          export CCACHE_DIR=/tmp/ccache
          export CMAKE_ARGS="$CMAKE_ARGS -DGGML_CCACHE=ON"
          ccache --max-size=2G 2>/dev/null || true
          ccache --zero-stats 2>/dev/null || true

          # MKL and SYCL both need Intel's env sourced (MKLROOT for MKL's BLAS vendor lookup;
          # the icx/icpx compilers on PATH for SYCL). No-op for every other variant.
          if [ -f /opt/intel/oneapi/setvars.sh ]; then
            set +u; source /opt/intel/oneapi/setvars.sh >/dev/null 2>&1 || true; set -u
            echo "MKLROOT=${MKLROOT:-unset}"
          fi
          if [ -n "$SYCL_BUILD" ]; then
            # SYCL builds with Intel's compiler, not gcc. Confirm it's on PATH.
            command -v icpx >/dev/null 2>&1 && echo "SYCL compiler: $(icpx --version | head -1)" \
              || echo "::warning::icpx not found — SYCL build will fail"
            export CC=icx CXX=icpx
          fi

          echo "variant: $V"
          echo "CMAKE_ARGS=$CMAKE_ARGS"
          cd /src && python -m build --wheel --outdir /out 2>&1 | tee /tmp/build.log

      - name: Confirm CPU flags applied (no -march=native leak)
        run: |
          grep "Adding CPU backend variant" /tmp/build.log || true
          if grep -q "march=native" /tmp/build.log; then
            echo "::error::-march=native leaked in — wheel not portable"; exit 1
          fi

      - name: Repair, dedupe, report size
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          . /opt/buildvenv/bin/activate
          RAW=$(ls /out/*.whl); echo "raw: $(du -h "$RAW" | cut -f1)"

          python -m wheel unpack "$RAW" -d /tmp/unpacked
          LIBDIR=$(dirname "$(find /tmp/unpacked -name 'libllama.so' | head -1)")
          if [ -z "$LIBDIR" ] || [ "$LIBDIR" = "." ]; then
            echo "::error::llama.cpp libs not found in wheel"; find /tmp/unpacked -name '*.so'; exit 1
          fi
          echo "wheel lib dir: $LIBDIR"

          # MKL note: unlike CUDA (excluded, because users install the CUDA toolkit), MKL is
          # NOT a standard user install — so it must be BUNDLED or the wheel can't import.
          # We therefore DON'T exclude libmkl/libiomp5; auditwheel packs them in. This makes
          # mkl wheels large (~150-400MB) but self-contained and actually working. The
          # original dataset's mkl wheels were ~4MB (excluded) and silently broken.
          # auditwheel needs Intel's libs (MKL and/or SYCL runtime) on its search path to find
          # and copy them — they live in oneAPI dirs, not a standard location. Add whichever exist.
          INTEL_PATHS=""
          for d in /opt/intel/oneapi/mkl/latest/lib \
                   /opt/intel/oneapi/mkl/latest/lib/intel64 \
                   /opt/intel/oneapi/compiler/latest/lib \
                   /opt/intel/oneapi/compiler/latest/linux/compiler/lib/intel64_lin; do
            [ -d "$d" ] && INTEL_PATHS="$d:$INTEL_PATHS"
          done
          [ -n "$INTEL_PATHS" ] && echo "Intel lib paths: $INTEL_PATHS"

          LD_LIBRARY_PATH="$LIBDIR:$INTEL_PATHS$LD_LIBRARY_PATH" auditwheel repair "$RAW" \
            --plat manylinux_2_31_x86_64 \
            --exclude libcuda.so.1 --exclude libcudart.so.12 \
            --exclude libcublas.so.12 --exclude libcublasLt.so.12 \
            --exclude libggml.so --exclude libggml-base.so --exclude libggml-cpu.so \
            --exclude libggml-cuda.so --exclude libllama.so --exclude libmtmd.so \
            -w /tmp/audited

          # NO dedupe. auditwheel's repaired wheel is already correct and self-contained:
          # libllama is patched to depend on the versioned, hashed libs in
          # llama_cpp_python.libs/ via RUNPATH. Deleting anything from there breaks that link
          # (it broke every GPU backend at import). There's some duplication with
          # llama_cpp/lib/ — accepted; a working wheel beats a smaller broken one, and there's
          # 8.7 TB of space. Just fix the name and go.
          mkdir -p /repaired
          FIXED=$(python "$GITHUB_WORKSPACE/fix_wheel_name.py" /tmp/audited/*.whl /repaired)
          echo "final: $FIXED"
          echo "FINAL SIZE: $(du -h /repaired/*.whl | cut -f1)"

      - name: Sanity-check the wheel imports
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # The wheel is tagged manylinux_2_31 (to match the dataset), but this build image is
          # manylinux_2_28 (glibc 2.28) — older than the wheel's floor — so a normal install
          # refuses it on platform grounds, even though it runs fine on any real 2.31+ system.
          # --python-platform tells uv to resolve as if on a 2_31 host (matching the wheel), so
          # the install succeeds and pulls numpy et al, and the import genuinely exercises the
          # compiled .so.
          uv venv --python ${{ matrix.python }} /tmp/checkenv
          uv pip install --python /tmp/checkenv/bin/python \
            --python-platform x86_64-manylinux_2_31 \
            --quiet /repaired/*.whl
          /tmp/checkenv/bin/python -c "import llama_cpp; print('import OK', llama_cpp.__version__)"

      - name: Check the name came out right
        run: |
          BUILT=$(basename /repaired/*.whl)
          echo "built:    $BUILT"
          echo "expected: ${{ matrix.name }}"
          [ "$BUILT" = "${{ matrix.name }}" ] || { echo "::error::filename mismatch"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: /repaired/*.whl
          if-no-files-found: error

      - name: Upload to the dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          . /opt/buildvenv/bin/activate
          uv pip install "huggingface_hub>=0.28"
          python - <<'PY'
          import os, glob
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN")
          if not token: raise SystemExit("HF_TOKEN secret not set")
          api = HfApi(token=token)
          for path in glob.glob("/repaired/*.whl"):
              name = os.path.basename(path)
              api.upload_file(path_or_fileobj=path, path_in_repo=name,
                              repo_id="AIencoder/llama-cpp-wheels", repo_type="dataset",
                              commit_message=f"wheel: {name}")
              print("uploaded", name)
          PY

      # ---- FAILURE LOGGING: on any failure above, write the log tail to the repo ----
      - name: Record failure to repo
        if: failure()
        continue-on-error: true
        run: |
          # Best-effort: never let this step itself fail the job (it already failed above).
          mkdir -p failures
          OUT="failures/${{ matrix.name }}.txt"
          {
            echo "=== FAILED: ${{ matrix.name }} ==="
            echo "variant: ${{ matrix.variant }}   kind: ${{ matrix.kind }}   python: ${{ matrix.python }}   cuda: ${{ matrix.cuda }}"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "time: $(date -u)"
            echo ""
            echo "=== build log tail (last 60 lines) ==="
            tail -n 60 /tmp/build.log 2>/dev/null || echo "(no /tmp/build.log — failed before or during compile)"
          } > "$OUT"

          git config user.name  "factory[bot]"
          git config user.email "factory@users.noreply.github.com"
          # Resolve the branch: github.ref_name, or fall back to the default branch.
          BRANCH="${{ github.ref_name }}"
          [ -z "$BRANCH" ] && BRANCH="main"
          git add "$OUT" || exit 0
          git commit -m "failure log: ${{ matrix.name }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin "$BRANCH" 2>/dev/null && git push origin HEAD:"$BRANCH" 2>/dev/null; then
              echo "failure log pushed"; break
            fi
            echo "retry push $i"; sleep $((RANDOM % 6 + 2))
          done
