name: Factory

# llama-cpp-python wheel factory. Builds both CPU and CUDA wheels on free GitHub runners
# and pushes them to AIencoder/llama-cpp-wheels.
#
#   CPU wheels  -> plain manylinux image, backend flags from the variant name
#   CUDA wheels -> nvidia/cuda:*-devel-ubuntu20.04, self-contained, all architectures
#
# No GPU is used; nvcc cross-compiles. Both tag manylinux_2_31_x86_64 (glibc 2.31).
#
# EMERGENCY STOP: set "enabled": false in config.json. To kill a run already going, use
# the Cancel workflow button — nothing is lost, the queue is derived from the dataset.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Wheels this run (20 run in parallel on Free)"
        default: "20"
      dry_run:
        description: "Plan only — build nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- plan
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count || '0' }}
      remaining: ${{ steps.plan.outputs.remaining }}
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Emergency stop check
        id: gate
        run: |
          EN=$(python3 -c "import json; print(str(json.load(open('config.json')).get('enabled', True)).lower())")
          echo "enabled=$EN" >> $GITHUB_OUTPUT
          if [ "$EN" != "true" ]; then
            echo "::warning::Factory is disabled in config.json — planning and building skipped."
            printf '# Factory queue\n\n**STOPPED** — `enabled` is false in config.json.\n' > QUEUE.md
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - name: Install planner deps
        if: steps.gate.outputs.enabled == 'true'
        run: pip install "huggingface_hub>=0.28"

      - name: Work out what's missing
        id: plan
        if: steps.gate.outputs.enabled == 'true'
        env:
          BATCH: ${{ github.event.inputs.batch_size || '20' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open("config.json"))
          cfg["batch_size"] = int(os.environ["BATCH"])
          json.dump(cfg, open("config.json", "w"), indent=2)
          PY
          python plan.py

      - name: Publish the board
        run: |
          git config user.name  "factory[bot]"
          git config user.email "factory@users.noreply.github.com"
          git add -A QUEUE.md queue.json config.json || true
          git diff --staged --quiet || git commit -m "queue: ${{ steps.plan.outputs.remaining || 'stopped' }} [skip ci]"
          git push || true

      - name: Summary
        run: |
          {
            echo "### Factory"
            echo ""
            if [ "${{ steps.gate.outputs.enabled }}" != "true" ]; then
              echo "**STOPPED** via config.json."
            else
              echo "Dispatching **${{ steps.plan.outputs.count }}**, **${{ steps.plan.outputs.remaining }}** left after this."
            fi
          } >> $GITHUB_STEP_SUMMARY

  # --------------------------------------------------------------- build
  build:
    needs: plan
    if: >-
      needs.plan.outputs.enabled == 'true' &&
      needs.plan.outputs.count != '0' &&
      github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # CUDA wheels build inside the CUDA devel image; CPU wheels in a plain manylinux-era
    # Ubuntu. The matrix carries an empty "cuda" for CPU jobs, so pick the image per-row.
    container:
      image: ${{ matrix.kind == 'cuda' && format('nvidia/cuda:{0}-devel-ubuntu20.04', matrix.cuda) || 'ubuntu:20.04' }}

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out the repo (for fix_wheel_name.py)
        uses: actions/checkout@v4

      - name: Build tooling
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils
          # CPU builds need GCC 11+: focal ships GCC 9, which doesn't know the newest
          # instruction flags (-mavxvnni, AVX-512 VBMI/BF16, AMX). Without it the 9
          # variants using those instructions fail to compile. CUDA builds use the CUDA
          # image's own host compiler and don't need this.
          if [ "${{ matrix.kind }}" = "cpu" ]; then
            apt-get install -y --no-install-recommends software-properties-common
            add-apt-repository -y ppa:ubuntu-toolchain-r/test || true
            apt-get update
            apt-get install -y --no-install-recommends gcc-11 g++-11 || \
              apt-get install -y --no-install-recommends gcc-10 g++-10 || true
          fi
          rm -rf /var/lib/apt/lists/*
          echo "glibc: $(ldd --version | head -1)"
          if [ "${{ matrix.kind }}" = "cuda" ]; then nvcc --version; fi

      # OpenBLAS / MKL / etc. need their dev libraries present at build time. Only install
      # what a CPU variant actually needs; CUDA and baseline variants skip this.
      - name: Backend libraries (CPU variants)
        if: matrix.kind == 'cpu'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          case "${{ matrix.variant }}" in
            openblas*) apt-get update && apt-get install -y --no-install-recommends libopenblas-dev ;;
            mkl*)      apt-get update && apt-get install -y --no-install-recommends intel-mkl || echo "::warning::intel-mkl unavailable, build may fall back" ;;
            vulkan*)   apt-get update && apt-get install -y --no-install-recommends libvulkan-dev glslang-tools ;;
            clblast*)  apt-get update && apt-get install -y --no-install-recommends libclblast-dev ;;
            opencl*)   apt-get update && apt-get install -y --no-install-recommends ocl-icd-opencl-dev ;;
          esac
          rm -rf /var/lib/apt/lists/*

      # CUDA only: FindCUDAToolkit resolves CUDA::cuda_driver via libcuda.so, which a
      # container lacks (only the stub is present). Point cmake straight at the stub.
      - name: Locate the CUDA driver library
        if: matrix.kind == 'cuda'
        run: |
          DRIVER=$(find /usr/local/cuda* -name 'libcuda.so' 2>/dev/null | head -1)
          if [ -z "$DRIVER" ]; then
            DRIVER=$(find /usr/local/cuda* -name 'libcuda.so*' 2>/dev/null | head -1)
          fi
          if [ -z "$DRIVER" ]; then
            echo "::error::no libcuda.so under /usr/local/cuda*"; exit 1
          fi
          echo "CUDA_DRIVER_LIB=$DRIVER" >> $GITHUB_ENV
          echo "driver library: $DRIVER"

      - name: Python ${{ matrix.python }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv python install ${{ matrix.python }}
          uv venv --python ${{ matrix.python }} /opt/venv
          . /opt/venv/bin/activate
          # patchelf from pip, NOT apt: focal ships 0.10, auditwheel needs >= 0.14.5.
          uv pip install "cmake>=3.28" ninja build wheel auditwheel scikit-build-core patchelf
          patchelf --version

      - name: Fetch ${{ matrix.llama }}
        run: |
          git clone --depth 1 --recursive --shallow-submodules \
            --branch "${{ matrix.llama }}" \
            https://github.com/abetlen/llama-cpp-python.git /src
          test -d /src/vendor/llama.cpp || { echo "::error::submodule missing"; exit 1; }

      - name: Stamp local version
        run: |
          F=/src/llama_cpp/__init__.py
          CUR=$(grep -oP '__version__\s*=\s*"\K[^"]+' "$F")
          sed -i "s/__version__ = \"$CUR\"/__version__ = \"$CUR+${{ matrix.variant }}\"/" "$F"
          echo "building $CUR+${{ matrix.variant }} for ${{ matrix.python }}"

      # The variant name IS the build recipe. Map it to cmake flags. CPU baseline flags
      # (avx/avx2/...) are shared; the backend prefix (openblas/mkl/vulkan/...) adds its own.
      - name: Compile
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          . /opt/venv/bin/activate
          V="${{ matrix.variant }}"

          # ---- CPU instruction-set flags from the tail of the name ----
          # Default everything off; turn on what the name lists. GGML_NATIVE OFF always,
          # or -march=native silently overrides these and the label becomes a lie.
          CPU="-DGGML_NATIVE=OFF -DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_AVX512=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_SSE42=OFF -DGGML_BMI2=OFF"
          case "$V" in
            *avx512*vnni*vbmi*bf16*amx*) CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_AVX512=ON -DGGML_AVX512_VNNI=ON -DGGML_AVX512_VBMI=ON -DGGML_AVX512_BF16=ON -DGGML_FMA=ON -DGGML_F16C=ON" ;;
            *avx512*vnni*vbmi*)          CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_AVX512=ON -DGGML_AVX512_VNNI=ON -DGGML_AVX512_VBMI=ON -DGGML_FMA=ON -DGGML_F16C=ON" ;;
            *avx512*)                    CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_AVX512=ON -DGGML_FMA=ON -DGGML_F16C=ON" ;;
            *avx2*avxvnni*)              CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_AVX_VNNI=ON -DGGML_FMA=ON -DGGML_F16C=ON" ;;
            *avx2*fma*f16c*)             CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON" ;;
            *avx*f16c*)                  CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_F16C=ON" ;;
            *avx*)                       CPU="-DGGML_NATIVE=OFF -DGGML_AVX=ON" ;;
          esac

          # ---- backend prefix ----
          BACKEND=""
          case "$V" in
            openblas*) BACKEND="-DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS" ;;
            mkl*)      BACKEND="-DGGML_BLAS=ON -DGGML_BLAS_VENDOR=Intel10_64lp" ;;
            vulkan*)   BACKEND="-DGGML_VULKAN=ON" ;;
            clblast*)  BACKEND="-DGGML_CLBLAST=ON" ;;
            opencl*)   BACKEND="-DGGML_OPENCL=ON" ;;
            sycl*)     BACKEND="-DGGML_SYCL=ON" ;;
            rpc*)      BACKEND="-DGGML_RPC=ON" ;;
            cu*)       BACKEND="-DGGML_CUDA=ON -DGGML_CUDA_FORCE_MMQ=ON -DCMAKE_CUDA_ARCHITECTURES=all -DCUDA_cuda_driver_LIBRARY=${CUDA_DRIVER_LIB}" ;;
          esac

          export CMAKE_ARGS="$BACKEND $CPU"
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)

          # For CPU builds, use GCC 11 if we installed it — focal's default GCC 9 rejects
          # -mavxvnni and the AVX-512 VBMI/BF16/AMX flags. CUDA builds keep their own host
          # compiler (nvcc manages it). Only switch if the newer gcc is actually present.
          if [ "${{ matrix.kind }}" = "cpu" ]; then
            if command -v gcc-11 >/dev/null 2>&1; then
              export CC=gcc-11 CXX=g++-11
            elif command -v gcc-10 >/dev/null 2>&1; then
              export CC=gcc-10 CXX=g++-10
            fi
            echo "CPU compiler: ${CC:-gcc (default)}"
          fi

          echo "variant: $V"
          echo "CMAKE_ARGS=$CMAKE_ARGS"
          cd /src && python -m build --wheel --outdir /out 2>&1 | tee /tmp/build.log

      - name: Confirm CPU flags applied (no -march=native leak)
        run: |
          grep "Adding CPU backend variant" /tmp/build.log || true
          if grep -q "march=native" /tmp/build.log; then
            echo "::error::-march=native leaked in — wheel not portable"; exit 1
          fi

      - name: Repair, dedupe, report size
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          . /opt/venv/bin/activate
          RAW=$(ls /out/*.whl); echo "raw: $(du -h "$RAW" | cut -f1)"

          python -m wheel unpack "$RAW" -d /tmp/unpacked
          LIBDIR=$(dirname "$(find /tmp/unpacked -name 'libllama.so' | head -1)")
          if [ -z "$LIBDIR" ] || [ "$LIBDIR" = "." ]; then
            echo "::error::llama.cpp libs not found in wheel"; find /tmp/unpacked -name '*.so'; exit 1
          fi
          echo "wheel lib dir: $LIBDIR"

          # Exclude the ggml family (already vendored in llama_cpp/lib/) so auditwheel doesn't
          # copy a second set into llama_cpp_python.libs/. CUDA runtime libs excluded too.
          LD_LIBRARY_PATH="$LIBDIR:$LD_LIBRARY_PATH" auditwheel repair "$RAW" \
            --plat manylinux_2_31_x86_64 \
            --exclude libcuda.so.1 --exclude libcudart.so.12 \
            --exclude libcublas.so.12 --exclude libcublasLt.so.12 \
            --exclude libggml.so --exclude libggml-base.so --exclude libggml-cpu.so \
            --exclude libggml-cuda.so --exclude libllama.so --exclude libmtmd.so \
            -w /tmp/audited

          # Drop the DUPLICATE ggml/llama libs only. auditwheel copies the whole vendored
          # set into llama_cpp_python.libs/ (with hash suffixes), but those same libs are
          # already in llama_cpp/lib/ where the loader reads them — so the .libs/ copies are
          # redundant. BUT .libs/ also holds genuine external deps auditwheel pulled in, like
          # libgomp (OpenMP runtime). Deleting the whole dir removed libgomp too and the wheel
          # failed to import. So delete only files whose basename starts with a vendored lib
          # name; keep everything else. Same for the top-level lib/ tree (pure duplicate).
          AUD=$(ls /tmp/audited/*.whl)
          python - "$AUD" <<'PY'
          import sys, zipfile, os, shutil, hashlib, base64, csv
          src = sys.argv[1]; work = "/tmp/deduped_tree"
          if os.path.exists(work): shutil.rmtree(work)
          os.makedirs(work)
          with zipfile.ZipFile(src) as z: z.extractall(work)

          VENDORED = ("libggml", "libllama", "libmtmd")  # these live in llama_cpp/lib/ already
          def is_dupe(fname):
              return any(fname.startswith(v) for v in VENDORED)

          # top-level lib/ is an exact duplicate of llama_cpp/lib/ — safe to remove wholesale
          top = os.path.join(work, "lib")
          if os.path.isdir(top):
              shutil.rmtree(top); print("removed redundant lib/")

          # llama_cpp_python.libs/ — remove ONLY the vendored dupes, keep real deps (libgomp)
          auditlibs = os.path.join(work, "llama_cpp_python.libs")
          if os.path.isdir(auditlibs):
              for f in os.listdir(auditlibs):
                  if is_dupe(f):
                      os.remove(os.path.join(auditlibs, f)); print("dropped dupe", f)
                  else:
                      print("kept real dep", f)
              # if nothing left, drop the empty dir
              if not os.listdir(auditlibs):
                  os.rmdir(auditlibs)

          distinfo = [n for n in os.listdir(work) if n.endswith(".dist-info")][0]
          rows = []
          for root, _, files in os.walk(work):
              for f in files:
                  full = os.path.join(root, f)
                  rel = os.path.relpath(full, work).replace(os.sep, "/")
                  if rel.endswith("RECORD"): rows.append((rel, "", "")); continue
                  data = open(full, "rb").read()
                  h = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b"=").decode()
                  rows.append((rel, f"sha256={h}", str(len(data))))
          with open(os.path.join(work, distinfo, "RECORD"), "w", newline="") as fh:
              csv.writer(fh).writerows(rows)
          out = "/tmp/deduped"; os.makedirs(out, exist_ok=True)
          base = os.path.basename(src)
          shutil.make_archive(os.path.join(out, base[:-4]), "zip", work)
          os.rename(os.path.join(out, base[:-4] + ".zip"), os.path.join(out, base))
          print("deduped:", os.path.join(out, base))
          PY

          mkdir -p /repaired
          FIXED=$(python "$GITHUB_WORKSPACE/fix_wheel_name.py" /tmp/deduped/*.whl /repaired)
          echo "final: $FIXED"
          echo "FINAL SIZE: $(du -h /repaired/*.whl | cut -f1)"

      - name: Sanity-check the wheel imports
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Fresh throwaway venv, installed into with uv (a bare `uv venv` has no pip of its
          # own). --python-preference only-managed keeps it off the system interpreter.
          uv venv --python ${{ matrix.python }} /tmp/checkenv
          VIRTUAL_ENV=/tmp/checkenv uv pip install --quiet /repaired/*.whl
          /tmp/checkenv/bin/python -c "import llama_cpp; print('import OK', llama_cpp.__version__)"

      - name: Check the name came out right
        run: |
          BUILT=$(basename /repaired/*.whl)
          echo "built:    $BUILT"
          echo "expected: ${{ matrix.name }}"
          [ "$BUILT" = "${{ matrix.name }}" ] || {
            echo "::error::filename mismatch — planner would re-queue forever"; exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: /repaired/*.whl
          if-no-files-found: error

      - name: Upload to the dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          . /opt/venv/bin/activate
          uv pip install "huggingface_hub>=0.28"
          python - <<'PY'
          import os, glob
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN")
          if not token: raise SystemExit("HF_TOKEN secret not set")
          api = HfApi(token=token)
          for path in glob.glob("/repaired/*.whl"):
              name = os.path.basename(path)
              api.upload_file(path_or_fileobj=path, path_in_repo=name,
                              repo_id="AIencoder/llama-cpp-wheels", repo_type="dataset",
                              commit_message=f"wheel: {name}")
              print("uploaded", name)
          PY
