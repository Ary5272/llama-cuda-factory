name: Factory

# CUDA wheel factory. Builds inside nvidia/cuda:*-devel-ubuntu20.04 — no GPU involved,
# nvcc cross-compiles.
#
# EMERGENCY STOP: set "enabled": false in config.json. Every future run then plans
# nothing and builds nothing. To kill a run already going, use the Cancel workflow
# button on the run page — nothing is lost, the queue is derived from the dataset.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Wheels this run (20 run in parallel on Free)"
        default: "20"
      dry_run:
        description: "Plan only — build nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: factory
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- plan
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count || '0' }}
      remaining: ${{ steps.plan.outputs.remaining }}
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Emergency stop check
        id: gate
        run: |
          EN=$(python3 -c "import json; print(str(json.load(open('config.json')).get('enabled', True)).lower())")
          echo "enabled=$EN" >> $GITHUB_OUTPUT
          if [ "$EN" != "true" ]; then
            echo "::warning::Factory is disabled in config.json — planning and building skipped."
            printf '# Factory queue\n\n**STOPPED** — `enabled` is false in config.json.\n' > QUEUE.md
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - name: Install planner deps
        if: steps.gate.outputs.enabled == 'true'
        run: pip install "huggingface_hub>=0.28"

      - name: Work out what's missing
        id: plan
        if: steps.gate.outputs.enabled == 'true'
        env:
          BATCH: ${{ github.event.inputs.batch_size || '20' }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open("config.json"))
          cfg["batch_size"] = int(os.environ["BATCH"])
          json.dump(cfg, open("config.json", "w"), indent=2)
          PY
          python plan.py

      - name: Publish the board
        run: |
          git config user.name  "factory[bot]"
          git config user.email "factory@users.noreply.github.com"
          git add -A QUEUE.md queue.json config.json || true
          git diff --staged --quiet || git commit -m "queue: ${{ steps.plan.outputs.remaining || 'stopped' }} [skip ci]"
          git push || true

      - name: Summary
        run: |
          {
            echo "### Factory"
            echo ""
            if [ "${{ steps.gate.outputs.enabled }}" != "true" ]; then
              echo "**STOPPED** via config.json."
            else
              echo "Dispatching **${{ steps.plan.outputs.count }}**, **${{ steps.plan.outputs.remaining }}** left after this."
            fi
          } >> $GITHUB_STEP_SUMMARY

  # --------------------------------------------------------------- build
  build:
    needs: plan
    if: >-
      needs.plan.outputs.enabled == 'true' &&
      needs.plan.outputs.count != '0' &&
      github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      image: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu20.04

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Build tooling
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates xz-utils
          rm -rf /var/lib/apt/lists/*
          nvcc --version
          echo "glibc: $(ldd --version | head -1)"

      # FindCUDAToolkit resolves CUDA::cuda_driver by looking for libcuda.so. A container
      # has no driver, only the toolkit's stub — point cmake straight at it rather than
      # hoping the search finds it. This is what broke the first Kaggle attempts.
      - name: Locate the CUDA driver library
        run: |
          DRIVER=$(find /usr/local/cuda* -name 'libcuda.so' 2>/dev/null | head -1)
          if [ -z "$DRIVER" ]; then
            DRIVER=$(find /usr/local/cuda* -name 'libcuda.so*' 2>/dev/null | head -1)
          fi
          if [ -z "$DRIVER" ]; then
            echo "::error::no libcuda.so under /usr/local/cuda*"
            find /usr/local/cuda* -name 'libcuda*' 2>/dev/null || true
            exit 1
          fi
          echo "CUDA_DRIVER_LIB=$DRIVER" >> $GITHUB_ENV
          echo "driver library: $DRIVER"

      - name: Python ${{ matrix.python }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv python install ${{ matrix.python }}
          uv venv --python ${{ matrix.python }} /opt/venv
          . /opt/venv/bin/activate
          # patchelf from pip, NOT apt: focal ships 0.10 and auditwheel needs >= 0.14.5.
          # The venv's bin comes ahead of /usr/bin once activated.
          uv pip install "cmake>=3.28" ninja build wheel auditwheel scikit-build-core patchelf
          patchelf --version

      - name: Fetch ${{ matrix.llama }}
        run: |
          git clone --depth 1 --recursive --shallow-submodules \
            --branch "${{ matrix.llama }}" \
            https://github.com/abetlen/llama-cpp-python.git /src
          test -d /src/vendor/llama.cpp || { echo "::error::submodule missing"; exit 1; }

      - name: Stamp local version
        run: |
          CU=$(echo "${{ matrix.cuda }}" | cut -d. -f1,2 | tr -d .)
          LOCAL="cu${CU}_${{ matrix.cpu }}"
          F=/src/llama_cpp/__init__.py
          CUR=$(grep -oP '__version__\s*=\s*"\K[^"]+' "$F")
          sed -i "s/__version__ = \"$CUR\"/__version__ = \"$CUR+$LOCAL\"/" "$F"
          echo "building $CUR+$LOCAL for ${{ matrix.python }}"

      - name: Compile
        env:
          # 60 so Kaggle's P100 can run these, up to 89 for Ada.
          CUDA_ARCHS: "60;61;70;75;80;86;89"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          . /opt/venv/bin/activate
          # GGML_NATIVE defaults ON and silently overrides everything below with
          # -march=native, tuning each wheel to whatever CPU the runner happened to draw.
          # basic also needs SSE42 and BMI2 off: BMI2 is Haswell-era, and a baseline
          # wheel carrying it would crash on the pre-2013 machines that variant exists for.
          case "${{ matrix.cpu }}" in
            basic)
              CPU="-DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_SSE42=OFF -DGGML_BMI2=OFF" ;;
            avx2_fma_f16c)
              CPU="-DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON" ;;
            avx512_fma_f16c)
              CPU="-DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_AVX512=ON -DGGML_FMA=ON -DGGML_F16C=ON" ;;
            *)
              echo "::error::unknown cpu variant ${{ matrix.cpu }}"; exit 1 ;;
          esac
          # CMAKE_BUILD_TYPE is deliberately absent — scikit-build-core sets Release
          # itself and warns three times per build when you pass it.
          export CMAKE_ARGS="-DGGML_CUDA=ON -DGGML_NATIVE=OFF -DCMAKE_CUDA_ARCHITECTURES=${CUDA_ARCHS} -DCUDA_cuda_driver_LIBRARY=${CUDA_DRIVER_LIB} $CPU"
          export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
          echo "CMAKE_ARGS=$CMAKE_ARGS"
          cd /src && python -m build --wheel --outdir /out 2>&1 | tee /tmp/build.log

      - name: Confirm the CPU flags actually applied
        run: |
          # The build prints "Adding CPU backend variant ggml-cpu: <flags>". If that says
          # march=native, GGML_NATIVE didn't take and the wheel's CPU label is a lie.
          grep "Adding CPU backend variant" /tmp/build.log || true
          if grep -q "march=native" /tmp/build.log; then
            echo "::error::-march=native leaked in — wheel is not portable"
            exit 1
          fi

      - name: Repair to manylinux_2_31
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          . /opt/venv/bin/activate
          # CUDA libraries stay out: bundling cuBLAS is what makes upstream's Windows
          # wheels 428 MB. The installing machine supplies its own runtime.
          auditwheel repair /out/*.whl \
            --plat manylinux_2_31_x86_64 \
            --exclude libcuda.so.1 \
            --exclude libcudart.so.12 \
            --exclude libcublas.so.12 \
            --exclude libcublasLt.so.12 \
            -w /repaired
          ls -lh /repaired

      - name: Check the name came out right
        run: |
          BUILT=$(basename /repaired/*.whl)
          echo "built:    $BUILT"
          echo "expected: ${{ matrix.name }}"
          [ "$BUILT" = "${{ matrix.name }}" ] || {
            echo "::error::filename mismatch — the planner would re-queue this forever"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: /repaired/*.whl
          if-no-files-found: error

      - name: Upload to the dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          . /opt/venv/bin/activate
          uv pip install "huggingface_hub>=0.28"
          python - <<'PY'
          import os, glob
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN secret is not set")
          api = HfApi(token=token)
          for path in glob.glob("/repaired/*.whl"):
              name = os.path.basename(path)
              api.upload_file(path_or_fileobj=path, path_in_repo=name,
                              repo_id="AIencoder/llama-cpp-wheels", repo_type="dataset",
                              commit_message=f"CUDA wheel: {name}")
              print("uploaded", name)
          PY
