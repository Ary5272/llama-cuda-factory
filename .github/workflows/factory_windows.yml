name: Factory (Windows CUDA)

# Matrix-driven Windows CUDA factory — same design as the Linux factory.yml, but builds
# only the windows_cuda wheel kind (via KINDS=windows_cuda), on windows-2022 runners.
# The planner (plan.py) computes the full Windows matrix, diffs against the dataset, and
# dispatches the next batch. You pick batch_size; the cron grinds the rest.
#
# NOTE: Windows CUDA wheels are SLOW (~30-60 min each, MSVC+nvcc) and GitHub gives fewer
# concurrent Windows runners than Linux. A batch of 40 may take hours of wall-clock. That's
# fine for the cron; just not Linux speed.

on:
  schedule:
    - cron: "30 */6 * * *"      # offset from the Linux cron
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Windows CUDA wheels this run (type e.g. 40; they run slow)"
        default: "20"
      dry_run:
        description: "Plan only — build nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: factory-windows
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- plan
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count || '0' }}
      remaining: ${{ steps.plan.outputs.remaining }}
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Emergency stop check
        id: gate
        run: |
          EN=$(python3 -c "import json; print(str(json.load(open('config.json')).get('enabled', True)).lower())")
          echo "enabled=$EN" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.28"
        if: steps.gate.outputs.enabled == 'true'
      - name: Plan (windows_cuda only)
        id: plan
        if: steps.gate.outputs.enabled == 'true'
        env:
          BATCH: ${{ github.event.inputs.batch_size || '20' }}
          KINDS: windows_cuda
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          cfg = json.load(open("config.json"))
          cfg["batch_size"] = int(os.environ["BATCH"])
          json.dump(cfg, open("config.json", "w"), indent=2)
          PY
          python plan.py
      - name: Summary
        run: |
          echo "### Windows CUDA factory" >> $GITHUB_STEP_SUMMARY
          echo "Dispatching **${{ steps.plan.outputs.count }}**, **${{ steps.plan.outputs.remaining }}** Windows CUDA wheels left." >> $GITHUB_STEP_SUMMARY

  # --------------------------------------------------------------- build
  build:
    needs: plan
    if: >-
      needs.plan.outputs.enabled == 'true' &&
      needs.plan.outputs.count != '0' &&
      github.event.inputs.dry_run != 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5          # Windows runners are limited; don't over-queue
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install CUDA ${{ matrix.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.19
        id: cuda
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - name: Fetch ${{ matrix.llama }}
        run: |
          git clone --depth 1 --recursive --shallow-submodules `
            --branch ${{ matrix.llama }} `
            https://github.com/abetlen/llama-cpp-python.git src
        shell: pwsh

      - name: Build deps
        run: |
          python -m pip install --upgrade pip
          pip install build wheel ninja scikit-build-core "huggingface_hub>=0.28"
        shell: pwsh

      - name: Stamp local version (${{ matrix.variant }})
        run: |
          $f = "src/llama_cpp/__init__.py"
          $cur = (Select-String -Path $f -Pattern '__version__\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          (Get-Content $f) -replace [regex]::Escape("__version__ = `"$cur`""), "__version__ = `"$cur+${{ matrix.variant }}`"" | Set-Content $f
          echo "building $cur+${{ matrix.variant }}"
        shell: pwsh

      - name: Build wheel
        env:
          # Trimmed arch list + parallelism — all-major caused a 19h build.
          CMAKE_ARGS: "-DGGML_CUDA=on -DGGML_CUDA_FORCE_CUBLAS=1 -DCMAKE_CUDA_ARCHITECTURES=75-real;86-real;89-real;90-virtual"
          FORCE_CMAKE: "1"
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          cd src
          python -m build --wheel --outdir ../dist
        shell: pwsh

      # Bundle the CUDA runtime DLLs next to llama.dll. This is REQUIRED, not optional:
      # llama-cpp-python loads llama.dll with LOAD_LIBRARY_SEARCH_DLL_LOAD_DIR semantics, so
      # Windows searches ONLY the DLL's own directory (llama_cpp/lib) for its dependencies — a
      # CUDA install on PATH or CUDA_PATH is NOT consulted at load time. So cudart/cublas/
      # cublasLt must physically sit in llama_cpp/lib, or the import dies with "Could not find
      # llama.dll (or one of its dependencies)" — exactly the failure we saw.
      #
      # Two robustness fixes over the old step:
      #   1. Hard-fail if zero CUDA DLLs are found (the old glob copied silently — a wrong
      #      CUDA path bundled nothing and the step still "passed", shipping a broken wheel).
      #   2. Repack with the `wheel` tool, not Compress-Archive, so RECORD is regenerated and
      #      zip entries use forward slashes (Compress-Archive can corrupt both).
      # The lib listings before/after make the next run self-diagnosing.
      - name: Bundle CUDA DLLs
        run: |
          $ErrorActionPreference = "Stop"
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          Write-Host "built wheel: $wheel"

          python -m wheel unpack $wheel -d wheelwork
          $pkgdir = (Get-ChildItem wheelwork -Directory | Select-Object -First 1).FullName
          $libdir = Join-Path $pkgdir "llama_cpp/lib"

          Write-Host "=== llama_cpp/lib BEFORE bundling ==="
          Get-ChildItem $libdir | ForEach-Object { Write-Host "  $($_.Name)" }

          # Find the CUDA runtime DLLs. Prefer the action's output path, fall back to the
          # CUDA_PATH env var, and search recursively so the exact subdir doesn't matter.
          $cudaRoot = "${{ steps.cuda.outputs.CUDA_PATH }}"
          if (-not $cudaRoot -or -not (Test-Path $cudaRoot)) { $cudaRoot = $env:CUDA_PATH }
          Write-Host "CUDA root: $cudaRoot"
          $dlls = Get-ChildItem -Path $cudaRoot -Recurse -ErrorAction Ignore `
            -Include cudart64_*.dll,cublas64_*.dll,cublasLt64_*.dll
          if (-not $dlls -or @($dlls).Count -eq 0) {
            Write-Host "::error::no CUDA runtime DLLs found under $cudaRoot — cannot bundle"
            exit 1
          }
          $dlls | ForEach-Object { Copy-Item $_.FullName $libdir -Force; Write-Host "  bundled $($_.Name)" }

          Write-Host "=== llama_cpp/lib AFTER bundling ==="
          Get-ChildItem $libdir | ForEach-Object { Write-Host "  $($_.Name)" }

          # Repack with the wheel tool (regenerates RECORD with correct hashes + forward slashes).
          Remove-Item $wheel
          python -m wheel pack $pkgdir -d dist
          $built = (Get-ChildItem dist/*.whl | Select-Object -First 1).Name
          Write-Host "repacked: $built"
          if ($built -ne "${{ matrix.name }}") {
            Write-Host "::warning::name is $built, expected ${{ matrix.name }}"
          }
        shell: pwsh

      - name: Smoke-test
        run: |
          $ErrorActionPreference = "Stop"
          $w = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          pip install $w
          # Show what actually landed in the installed lib dir, right before the import that
          # was failing — so a remaining missing-DLL shows up here instead of as a mystery.
          $libdir = python -c "import llama_cpp, os; print(os.path.join(os.path.dirname(llama_cpp.__file__), 'lib'))"
          Write-Host "=== installed llama_cpp/lib ==="
          Get-ChildItem $libdir | ForEach-Object { Write-Host "  $($_.Name)" }
          python -c "import llama_cpp; print('import OK', llama_cpp.__version__)"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.whl

      - name: Upload to the dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c @"
          import os, glob, time
          from huggingface_hub import HfApi
          from huggingface_hub.errors import HfHubHTTPError
          api = HfApi(token=os.environ['HF_TOKEN'])
          for path in glob.glob('dist/*.whl'):
              name = os.path.basename(path)
              for attempt in range(1, 11):
                  try:
                      api.upload_file(path_or_fileobj=path, path_in_repo=name,
                          repo_id='AIencoder/llama-cpp-wheels', repo_type='dataset',
                          commit_message=f'Windows CUDA wheel: {name}')
                      print('uploaded', name); break
                  except HfHubHTTPError as e:
                      if '429' in str(e) and attempt < 10:
                          time.sleep(min(90, 15*attempt))
                      else: raise
          "@
        shell: pwsh
